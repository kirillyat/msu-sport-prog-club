{#
  Пустые состояния. Правило: если строк нет — не рисуем шапку таблицы,
  вместо неё показываем, что сделать дальше.
#}
{% macro empty(name, text, href=None, label=None) -%}
<div class="empty">
  {{ icon(name, "xl") }}
  <div>{{ text }}</div>
  {% if href and label %}<a class="btn ghost small" href="{{ href }}">{{ label }}</a>{% endif %}
</div>
{%- endmacro %}
