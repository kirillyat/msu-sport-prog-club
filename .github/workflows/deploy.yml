# Выкатка на сервер. Запускается только вручную — пока не настроены секреты,
# ничего не произойдёт и красных крестиков в истории не будет.
#
# Нужные секреты репозитория (Settings → Secrets):
#   DEPLOY_HOST  — адрес сервера
#   DEPLOY_USER  — пользователь ssh
#   DEPLOY_KEY   — приватный ssh-ключ (без пароля)
#   DEPLOY_PATH  — каталог с репозиторием на сервере, например /srv/sport
#
# На сервере должны стоять git, docker и docker compose, а в DEPLOY_PATH
# лежать клон репозитория с заполненным .env.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка или тег для выкатки"
        required: false
        default: main

jobs:
  deploy:
    name: Выкатить на сервер
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты заданы
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "Секреты деплоя не настроены — см. комментарий в начале файла."
            exit 1
          fi

      - name: Подготовить ssh
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Обновить код и пересобрать
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -eu <<REMOTE
            cd "$DEPLOY_PATH"
            # Резервная копия до миграций: схема назад не откатывается.
            docker compose exec -T web python -m app.cli backup "/data/backup-\$(date +%F-%H%M).db" || true
            git fetch --all --tags
            git checkout "$REF"
            git pull --ff-only || true
            docker compose up -d --build
          REMOTE

      - name: Проверить, что сервис поднялся
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -eu <<'REMOTE'
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
                echo "сервис отвечает"
                exit 0
              fi
              sleep 2
            done
            echo "сервис не ответил"
            exit 1
          REMOTE

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/id_deploy
