# Зеркало в Gitea. Одностороннее: GitHub — источник, Gitea повторяет за ним.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   MIRROR_URL   — https://git.ai.msu.ru/kirillyat/sport-prog-club.git
#   MIRROR_USER  — имя пользователя в Gitea
#   MIRROR_TOKEN — токен доступа Gitea с правом записи в репозиторий
#
# Пока секреты не заданы, задание пропускается и красных крестиков не будет.
name: Mirror

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

jobs:
  mirror:
    name: Отправить в Gitea
    runs-on: ubuntu-latest
    if: ${{ secrets.MIRROR_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Отправить ветку и теги
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -eu
          # Логин и токен передаём отдельным заголовком, чтобы они не попали
          # ни в вывод команды, ни в .git/config.
          auth=$(printf '%s:%s' "$MIRROR_USER" "$MIRROR_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="Authorization: Basic $auth" \
              push "$MIRROR_URL" "HEAD:refs/heads/main"
          git -c http.extraheader="Authorization: Basic $auth" \
              push "$MIRROR_URL" --tags
