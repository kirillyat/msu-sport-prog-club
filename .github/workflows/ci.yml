# Gitea Actions по умолчанию читает и .github/workflows, и .gitea/workflows,
# поэтому один файл работает и в Gitea, и в GitHub. Если нужно развести
# поведение — скопируй этот файл в .gitea/workflows/ci.yml, он будет главнее.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Линтер, тесты, миграции
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff

      - name: Ruff
        run: ruff check .

      - name: Тесты
        env:
          SECRET_KEY: ci-secret-not-used-anywhere-else
        run: pytest -q

      - name: Модели и миграции не разъехались
        env:
          SECRET_KEY: ci-secret-not-used-anywhere-else
          DATA_DIR: ./data
        run: |
          mkdir -p data
          alembic upgrade head
          alembic check

  docker:
    name: Сборка образа и дымовой тест
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ
        run: docker build -t sport:ci .

      - name: Контейнер поднимается и отвечает
        run: |
          docker run -d --name sport-ci -p 8000:8000 \
            -e SECRET_KEY=ci-secret-not-used-anywhere-else \
            sport:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then
              echo "healthz отвечает"
              exit 0
            fi
            sleep 2
          done
          echo "healthz не ответил за 120 секунд"
          docker logs sport-ci
          exit 1

      - name: Логи при падении
        if: failure()
        run: docker logs sport-ci || true

      - name: Убрать за собой
        if: always()
        run: docker rm -f sport-ci || true

  guard:
    name: Отказ стартовать с дефолтным ключом
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать образ
        run: docker build -t sport:ci .
      - name: Без SECRET_KEY контейнер должен упасть
        run: |
          if docker run --rm -e DATA_DIR=/tmp/d sport:ci 2>&1 | grep -q "SECRET_KEY"; then
            echo "защита на месте"
          else
            echo "контейнер стартовал с дефолтным ключом — это регрессия"
            exit 1
          fi
